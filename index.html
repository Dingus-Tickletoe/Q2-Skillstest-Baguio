<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBMC Enroll Now</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="obmclogo.png" alt="OBMC Logo" width="50">
            OBMC
        </a>

        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Enroll Now</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container mt-4">
 <div class="row">
 <div class="col text-center">
            <h1>OBMC Student Enrollment Form</h1>
            
            <h2>Enroll Today!</h2>
            <p>Fill This Form to Enroll for the Next School Year!</p>
       
 </div>
</div>
</div>

<div class="container mt-4">
 <div class="row">
     <div class="col">
         <h2>Student Information</h2>

        <label class="form-label">First Name:</label>
            <input type="text" class="form-control" placeholder="Enter first name">

            <label class="form-label mt-2">Last Name:</label>
        <input type="text" class="form-control" placeholder="Enter last name">

            <label class="form-label mt-2">Date of Birth:</label>
           <input type="date" class="form-control">

            <label class="form-label mt-2">Gender:</label>
            <select class="form-control">
          <option>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>
        
        <label class="form-label mt-2">Grade Level:</label>
<select class="form-control">
    <option>Select Grade Level</option>
  <option>Pre-Kindergarten</option>
    <option>Kindergarten</option>
    <option>Grade 1</option>
    <option>Grade 2</option>
    <option>Grade 3</option>
    <option>Grade 4</option>
    <option>Grade 5</option>
    <option>Grade 6</option>
    <option>Grade 7</option>
    <option>Grade 8</option>
    <option>Grade 9</option>
    <option>Grade 10</option>
    <option>Grade 11</option>
    <option>Grade 12</option>
</select>
        
        </div>
    </div>
</div>

<div class="container mt-4">
    <div class="row">
        <div class="col">
            <h2>Contact Details</h2>

            <label class="form-label">Email Address:</label>
            <input type="email" class="form-control" placeholder="Enter email">

            <label class="form-label mt-2">Contact Number:</label>
            <input type="tel" class="form-control" placeholder="Enter contact number">

            
        </div>
    </div>
</div>

<form onsubmit="alert('Enrollment submitted successfully!'); return false;"></form>
</form>
<div class="container mt-4">
    <div class="row">
        <div class="col text-center">
            <button type="submit" class="btn btn-primary">
    Submit Enrollment
</button>
        </div>
    </div>
</div>

</head>
<body>
    <footer class="bg-dark text-white text-center p-2 mt-4">
